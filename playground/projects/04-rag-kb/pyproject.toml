[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-daydayup-rag-kb"
version = "1.0.0"
description = "Deterministic offline RAG knowledge base reference implementation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["rag_kb*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
