[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "python-daydayup-tool-agent"
version = "1.0.0"
description = "Offline, testable tool-loop agent with ACL, idempotency, memory, and MCP bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tool_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
