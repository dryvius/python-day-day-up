[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-daydayup-ai-chat"
version = "1.0.0"
description = "FastAPI AI chat service with deterministic FakeLLM and SSE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["ai_chat*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
