[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-daydayup-fastapi-todo"
version = "1.0.0"
description = "Layered FastAPI Todo API with SQLAlchemy and Alembic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["todo_api*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
